<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에임 트레이너</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<main id="menu">
  <header>
    <h1>🎯 에임 트레이너</h1>
    <p>발로란트 조준선 코드를 붙여넣고, 대기샷·플릭샷·트래킹 등 에임 연습을 해요.</p>
  </header>

  <div class="layout">
    <section class="modes" id="modes" aria-label="연습 모드"></section>

    <aside class="settings">
      <details open>
        <summary>🎯 조준선</summary>
        <label>조준선 코드 (발로란트 → 설정 → 조준선 → 가져오기)
          <textarea id="code" rows="3" spellcheck="false" placeholder="0;P;c;5;h;0;0l;4;0o;2;0a;1;0f;0;1b;0"></textarea>
        </label>
        <div class="row"><button id="applyCode" class="primary">적용</button><span id="codeMsg" class="msg"></span></div>
        <canvas id="preview" width="220" height="140"></canvas>
        <label>화면 배율 <input id="chScale" type="number" min="0.5" max="4" step="0.25"><small>1080p 에서는 1</small></label>
      </details>

      <details>
        <summary>🖱️ 감도·시야</summary>
        <label>감도 (발로란트) <input id="sens" type="number" min="0.05" max="10" step="0.01"></label>
        <label>가로 시야각 <input id="fov" type="number" min="70" max="120" step="1"><small>발로란트 기본 103</small></label>
      </details>

      <details>
        <summary>🔊 소리</summary>
        <label>타격 소리 <select id="hit"></select></label>
        <label>볼륨 <input id="volume" type="range" min="0" max="1" step="0.05"></label>
        <div class="row"><button id="testSound">킬 소리 들어보기</button></div>
      </details>

      <details>
        <summary>🔫 무기 스킨</summary>
        <label>밴달 스킨 <select id="skin"><option>불러오는 중…</option></select></label>
        <img id="skinPreview" alt="" hidden>
        <p class="hint" id="skinMsg"></p>
        <label>이 스킨 킬사운드 파일 <input type="file" id="skinSound" accept="audio/*"></label>
        <button type="button" id="skinSoundClear" class="ghost" hidden>올린 소리 지우기</button>
        <label>이 스킨 1인칭 총 이미지 <input type="file" id="skinImg" accept="image/*"></label>
        <button type="button" id="skinImgClear" hidden>올린 이미지 지우기</button>
        <p class="hint" id="skinSoundMsg"></p>
      </details>

      <details>
        <summary>⚙️ 연습 설정</summary>
        <label>연습 시간
          <select id="duration"><option value="30">30초</option><option value="60">60초</option><option value="120">120초</option></select>
        </label>
        <label>배경 <select id="bg"><option value="range">연습장 · 바닥과 거리 표시</option><option value="dark">어두운 연습장</option><option value="grid">기존 격자</option></select></label>
        <p class="hint">조준선은 중앙에 고정돼요. 마우스를 위로 움직이면 위를 바라봐요. 바닥 거리선과 벽의 눈높이 띠로 시선을 확인하세요.</p>
        <label class="check"><input id="guide" type="checkbox"> 대기샷 머리 높이 가이드 표시</label>
      </details>
    </aside>
  </div>
</main>

<div id="hudWeapon" hidden><img id="weaponImg" alt=""></div>

<div id="overlay" hidden>
  <div class="card" id="overlayCard"></div>
</div>

<script src="js/settings.js"></script>
<script src="js/crosshair.js"></script>
<script src="js/audio.js?v=recorded-assets-1"></script>
<script src="js/skins.js?v=muzzle-2"></script>
<script src="js/engine.js?v=muzzle-2"></script>
<script src="js/modes.js"></script>
<script src="js/main.js?v=muzzle-2"></script>
</body>
</html>
